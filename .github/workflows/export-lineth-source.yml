name: export-lineth-source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Go 1.25.7
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
          check-latest: true

      - name: Checkout exact Lineth snapshot
        uses: actions/checkout@v4
        with:
          repository: LFDT-Lineth/lineth-monorepo
          ref: b660c569ef2f6756b14d548382777a41b4df382c
          path: lineth-main
          fetch-depth: 1

      - name: Build exact Linea tracer plugins
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$GITHUB_WORKSPACE/tools" go install github.com/consensys/go-corset/cmd/go-corset@v1.2.10
          export PATH="$GITHUB_WORKSPACE/tools:$(go env GOPATH)/bin:$PATH"
          cd lineth-main
          ./gradlew :tracer:plugins:distZip --no-daemon --stacktrace
          cp tracer/plugins/build/distributions/*.zip "$GITHUB_WORKSPACE/linea-tracer-plugins.zip"
          cd "$GITHUB_WORKSPACE"
          sha256sum linea-tracer-plugins.zip > LINEA_PLUGIN_SHA256SUMS

      - name: Download exact Shomei Besu plugins
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output besu-shomei-plugin-v1.0.7.zip \
            'https://github.com/Consensys/besu-shomei-plugin/releases/download/v1.0.7/besu-shomei-plugin-v1.0.7.zip'
          sha256sum besu-shomei-plugin-v1.0.7.zip > SHOMEI_PLUGIN_SHA256SUMS

      - name: Upload exact plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: lineth-besu-plugin-bundles
          path: |
            linea-tracer-plugins.zip
            besu-shomei-plugin-v1.0.7.zip
            LINEA_PLUGIN_SHA256SUMS
            SHOMEI_PLUGIN_SHA256SUMS
          retention-days: 1
          if-no-files-found: error
