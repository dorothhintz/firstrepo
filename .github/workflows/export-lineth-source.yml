name: export-lineth-source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Go 1.25.7
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
          check-latest: true

      - name: Checkout exact Lineth snapshot
        uses: actions/checkout@v4
        with:
          repository: LFDT-Lineth/lineth-monorepo
          ref: b660c569ef2f6756b14d548382777a41b4df382c
          path: lineth-main
          fetch-depth: 1

      - name: Populate and split tracer offline build
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/gradle-home
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd lineth-main
          ./gradlew :tracer:arithmetization:testClasses --no-daemon --stacktrace
          cd "$GITHUB_WORKSPACE"
          tar -czf lineth-tracer-gradle-home.tar.gz gradle-home
          sha256sum lineth-tracer-gradle-home.tar.gz > GRADLE_HOME_SHA256SUMS
          split -b 240m -d -a 2 lineth-tracer-gradle-home.tar.gz gradle-home.part.
          for i in 00 01 02 03; do test -f "gradle-home.part.$i" || touch "gradle-home.part.$i"; done
          tar -czf lineth-tracer-build-outputs.tar.gz \
            -C lineth-main \
            buildSrc/build \
            tracer/testing/build \
            tracer/arithmetization/build \
            tracer-constraints/zkevm_osaka.bin
          sha256sum lineth-tracer-build-outputs.tar.gz > BUILD_OUTPUTS_SHA256SUMS
          ls -lh gradle-home.part.* lineth-tracer-build-outputs.tar.gz

      - name: Upload cache part 00
        uses: actions/upload-artifact@v4
        with:
          name: lineth-gradle-cache-part-00
          path: gradle-home.part.00
          retention-days: 1
          if-no-files-found: error

      - name: Upload cache part 01
        uses: actions/upload-artifact@v4
        with:
          name: lineth-gradle-cache-part-01
          path: gradle-home.part.01
          retention-days: 1
          if-no-files-found: error

      - name: Upload cache part 02
        uses: actions/upload-artifact@v4
        with:
          name: lineth-gradle-cache-part-02
          path: gradle-home.part.02
          retention-days: 1
          if-no-files-found: error

      - name: Upload cache part 03
        uses: actions/upload-artifact@v4
        with:
          name: lineth-gradle-cache-part-03
          path: gradle-home.part.03
          retention-days: 1
          if-no-files-found: error

      - name: Upload build outputs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: lineth-tracer-build-outputs
          path: |
            lineth-tracer-build-outputs.tar.gz
            GRADLE_HOME_SHA256SUMS
            BUILD_OUTPUTS_SHA256SUMS
          retention-days: 1
          if-no-files-found: error
