name: export-lineth-source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Archive Java toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          tar -czf temurin-jdk25-linux-x64.tar.gz -C "$JAVA_HOME" .
          sha256sum temurin-jdk25-linux-x64.tar.gz > JDK25_SHA256SUMS

      - name: Upload Java toolchain
        uses: actions/upload-artifact@v4
        with:
          name: temurin-jdk25-linux-x64
          path: |
            temurin-jdk25-linux-x64.tar.gz
            JDK25_SHA256SUMS
          retention-days: 1
          if-no-files-found: error
