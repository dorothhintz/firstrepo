name: export-lineth-source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Go 1.25.7
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
          check-latest: true

      - name: Checkout exact Lineth snapshot
        uses: actions/checkout@v4
        with:
          repository: LFDT-Lineth/lineth-monorepo
          ref: b660c569ef2f6756b14d548382777a41b4df382c
          path: lineth-main
          fetch-depth: 1

      - name: Populate tracer Gradle cache and build outputs
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/gradle-home
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd lineth-main
          ./gradlew :tracer:arithmetization:testClasses --no-daemon --stacktrace
          cd "$GITHUB_WORKSPACE"
          du -sh gradle-home
          tar -czf lineth-tracer-gradle-home.tar.gz gradle-home
          tar -czf lineth-tracer-build-outputs.tar.gz \
            -C lineth-main \
            buildSrc/build \
            tracer/testing/build \
            tracer/arithmetization/build \
            tracer-constraints/zkevm_osaka.bin \
            tracer-constraints/zkevm_prague.bin
          sha256sum lineth-tracer-gradle-home.tar.gz lineth-tracer-build-outputs.tar.gz > GRADLE_CACHE_SHA256SUMS

      - name: Upload tracer cache and build outputs
        uses: actions/upload-artifact@v4
        with:
          name: lineth-tracer-offline-build
          path: |
            lineth-tracer-gradle-home.tar.gz
            lineth-tracer-build-outputs.tar.gz
            GRADLE_CACHE_SHA256SUMS
          retention-days: 1
          if-no-files-found: error
