name: export-lineth-source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Checkout pinned Besu snapshot
        uses: actions/checkout@v4
        with:
          repository: besu-eth/besu
          ref: 3fd233a4f93556e932f734d8feecbad4a047ff67
          path: besu
          fetch-depth: 1

      - name: Archive tracked Besu files
        shell: bash
        run: |
          set -euo pipefail
          cd besu
          git archive --format=tar.gz --output="$GITHUB_WORKSPACE/besu-3fd233a4.tar.gz" HEAD
          cd "$GITHUB_WORKSPACE"
          sha256sum besu-3fd233a4.tar.gz > BESU_SOURCE_SHA256SUMS

      - name: Upload Besu source
        uses: actions/upload-artifact@v4
        with:
          name: besu-3fd233a4
          path: |
            besu-3fd233a4.tar.gz
            BESU_SOURCE_SHA256SUMS
          retention-days: 1
          if-no-files-found: error
