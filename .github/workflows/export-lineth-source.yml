name: export-lineth-source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Download published Besu EVM artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output besu-evm-26.6.1-3fd233a.jar \
            'https://artifacts.consensys.net/public/linea-besu/maven/org/hyperledger/besu/besu-evm/26.6.1-3fd233a/besu-evm-26.6.1-3fd233a.jar'
          jar tf besu-evm-26.6.1-3fd233a.jar | grep 'Keccak256Operation.class'
          sha256sum besu-evm-26.6.1-3fd233a.jar > BESU_EVM_SHA256SUMS

      - name: Upload Besu EVM artifact
        uses: actions/upload-artifact@v4
        with:
          name: besu-evm-26.6.1-3fd233a
          path: |
            besu-evm-26.6.1-3fd233a.jar
            BESU_EVM_SHA256SUMS
          retention-days: 1
          if-no-files-found: error
