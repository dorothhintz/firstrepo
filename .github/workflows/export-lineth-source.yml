name: export-lineth-source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Go 1.25.7
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
          check-latest: true

      - name: Checkout exact Lineth snapshot
        uses: actions/checkout@v4
        with:
          repository: LFDT-Lineth/lineth-monorepo
          ref: b660c569ef2f6756b14d548382777a41b4df382c
          path: lineth-main
          fetch-depth: 1

      - name: Build exact go-corset CLI
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$GITHUB_WORKSPACE/tools" go install github.com/consensys/go-corset/cmd/go-corset@v1.2.10
          "$GITHUB_WORKSPACE/tools/go-corset" --version || true
          sha256sum "$GITHUB_WORKSPACE/tools/go-corset" > GO_CORSET_SHA256SUMS

      - name: Resolve tracer testing runtime
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/gradle-home
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/tools:$(go env GOPATH)/bin:$PATH"
          cat > export-runtime.init.gradle <<'GRADLE'
          gradle.afterProject { p, state ->
            if (p.path == ':tracer:testing') {
              p.tasks.register('exportResolvedTestRuntime') {
                doLast {
                  def outDir = new File(rootProject.projectDir, '../runtime-jars')
                  outDir.mkdirs()
                  p.configurations.testRuntimeClasspath.resolve().each { f ->
                    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString().substring(0, 16)
                    new File(outDir, digest + '-' + f.name).bytes = f.bytes
                  }
                  println "exported runtime files=" + outDir.listFiles().size()
                }
              }
            }
          }
          GRADLE
          cd lineth-main
          ./gradlew :tracer:testing:exportResolvedTestRuntime \
            --init-script "$GITHUB_WORKSPACE/export-runtime.init.gradle" \
            --no-daemon --stacktrace
          cd "$GITHUB_WORKSPACE"
          tar -czf lineth-tracer-test-runtime.tar.gz runtime-jars
          sha256sum lineth-tracer-test-runtime.tar.gz > TRACER_RUNTIME_SHA256SUMS
          ls -lh lineth-tracer-test-runtime.tar.gz tools/go-corset

      - name: Upload exact tools
        uses: actions/upload-artifact@v4
        with:
          name: lineth-corset-and-test-runtime
          path: |
            tools/go-corset
            GO_CORSET_SHA256SUMS
            lineth-tracer-test-runtime.tar.gz
            TRACER_RUNTIME_SHA256SUMS
          retention-days: 1
          if-no-files-found: error
