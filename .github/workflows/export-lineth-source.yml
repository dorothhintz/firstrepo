name: export-lineth-source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Download Solidity 0.8.33
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output solc-0.8.33 \
            'https://github.com/ethereum/solidity/releases/download/v0.8.33/solc-static-linux'
          chmod +x solc-0.8.33
          ./solc-0.8.33 --version
          sha256sum solc-0.8.33 > SOLC_SHA256SUMS

      - name: Upload Solidity compiler
        uses: actions/upload-artifact@v4
        with:
          name: solc-0.8.33-linux-amd64
          path: |
            solc-0.8.33
            SOLC_SHA256SUMS
          retention-days: 1
          if-no-files-found: error
