name: export-lineth-source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Checkout exact Lineth snapshot
        uses: actions/checkout@v4
        with:
          repository: LFDT-Lineth/lineth-monorepo
          ref: b660c569ef2f6756b14d548382777a41b4df382c
          path: lineth-main
          fetch-depth: 1

      - name: Archive tracked monorepo files
        shell: bash
        run: |
          set -euo pipefail
          cd lineth-main
          git archive --format=tar.gz --output="$GITHUB_WORKSPACE/lineth-full-b660c569.tar.gz" HEAD
          cd "$GITHUB_WORKSPACE"
          sha256sum lineth-full-b660c569.tar.gz > FULL_SOURCE_SHA256SUMS

      - name: Upload full source
        uses: actions/upload-artifact@v4
        with:
          name: lineth-full-b660c569
          path: |
            lineth-full-b660c569.tar.gz
            FULL_SOURCE_SHA256SUMS
          retention-days: 1
          if-no-files-found: error
