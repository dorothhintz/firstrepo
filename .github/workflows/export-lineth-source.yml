name: export-lineth-source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Set up Go 1.25.7
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
          check-latest: true

      - name: Checkout Lineth main snapshot
        uses: actions/checkout@v4
        with:
          repository: LFDT-Lineth/lineth-monorepo
          ref: b660c569ef2f6756b14d548382777a41b4df382c
          path: lineth-main
          fetch-depth: 1

      - name: Checkout PR 3474 head snapshot
        uses: actions/checkout@v4
        with:
          repository: LFDT-Lineth/lineth-monorepo
          ref: b67f364112556069b97f5553df52471a470f4a61
          path: lineth-pr3474
          fetch-depth: 1

      - name: Populate combined Go module cache
        shell: bash
        run: |
          set -euo pipefail
          (cd lineth-main/prover && go test ./zkevm/prover/hash/packing/dedicated -run '^$' -count=0)
          (cd lineth-pr3474/prover && go test ./zkevm/prover/hash/packing/dedicated -run '^$' -count=0)
          GOPATH_PATH="$(go env GOPATH)"
          tar -czf lineth-prover-combined-go-mod-cache.tar.gz -C "$GOPATH_PATH" pkg/mod
          sha256sum lineth-prover-combined-go-mod-cache.tar.gz > MOD_CACHE_SHA256SUMS

      - name: Upload combined Go module cache
        uses: actions/upload-artifact@v4
        with:
          name: lineth-prover-combined-go-mod-cache
          path: |
            lineth-prover-combined-go-mod-cache.tar.gz
            MOD_CACHE_SHA256SUMS
          retention-days: 1
          if-no-files-found: error
